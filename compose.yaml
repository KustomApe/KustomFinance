services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: kustomfinance
      POSTGRES_USER: kustomfinance
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kustomfinance}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kustomfinance"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY を .env に設定してください}
      DATABASE_URL: postgres://kustomfinance:${DB_PASSWORD:-kustomfinance}@db:5432/kustomfinance
      OCR_ENGINE: ${OCR_ENGINE:-tesseract}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8000}
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
